[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codereview-loop"
version = "0.13.2"
description = "Multi-model code review loop: one agent builds, independent models review, a deterministic gate decides."
readme = "PYPI-README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Superstar Telecom LLC" }]
keywords = ["code-review", "multi-agent", "llm", "ci", "quality-gate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
codereview = "codereview.cli:console_main"
reviewloop = "codereview.cli:console_main"

[project.urls]
Homepage = "https://gitlab.com/superstartelecom/codereview"
Issues = "https://gitlab.com/superstartelecom/codereview/-/issues"
Security = "https://gitlab.com/superstartelecom/codereview/-/blob/master/SECURITY.md"

[tool.setuptools.packages.find]
where = ["src"]

# Lint + type configuration (external review 2026-11-10, §4.2).
# The CI lint job runs: ruff check src  +  mypy src/codereview.
# Rule sets start minimal — F (pyflakes), E9 (syntax/runtime
# subset of pycodestyle), B (bugbear) — exactly the sets the
# review prescribed; widen deliberately, not by accident.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B"]

[tool.ruff.lint.per-file-ignores]
# core.py carries two reviewed-safe default-argument idioms in
# run_workflow's step closures (the defaults are evaluated once
# per step, at definition time, which is exactly the semantics
# the code wants): B023 on the `sid` lambda default and B008 on
# the `_tests` cmds default. The genuine B023 (a deferred
# lambda capturing the precedent loop's `path`) was fixed.
"src/codereview/core.py" = ["B023", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
